name: Bug
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what happened instead.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Roadie version
      placeholder: "0.2.0"
    validations: { required: true }
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      placeholder: "MacBook Pro M2, macOS 15.5"
    validations: { required: true }
  - type: input
    id: audio
    attributes:
      label: Audio interface and camera
      placeholder: "Scarlett Solo 4th gen, FaceTime HD"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: textarea
    id: logs
    attributes:
      label: Log or screenshot
      description: Crash report (Console.app › Crash Reports) or a screenshot. Remove your personal paths.
